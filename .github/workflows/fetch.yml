name: 每日抓取台股資料

# ──────────────────────────────────────────────────────────────
# ★ 排程時間說明（2026-11-16 依實測結果重寫）
#
# ★★ 原本的假設是錯的 ★★
# 上線時設定台灣 18:30 / 22:30，並且認為「GitHub 的延遲反而是好事」，
# 因為以為官方收盤後一兩小時就會發布。實測結果完全相反。
#
# 把 repo 歷史裡每一次 commit 的 meta.json 排成時間軸：
#
#   執行時間（台北）      當時官方提供的最新交易日
#   11-10 20:49           11-09
#   11-11 10:14           11-10
#   11-12 02:03           11-10
#   11-12 05:29（排程）   11-10      ← 空跑
#   11-12 06:01（手動）   11-11      ← 就在這 32 分鐘內出現
#   11-13 05:32（排程）   11-12      ← 唯一命中的一次排程
#   11-14 04:56（排程）   11-12      ← 差 35 分鐘又落空
#
# 結論：**官方 OpenAPI 的收盤資料是隔天台北約 05:30~06:00 才更新**，
# 也就是收盤後大約 16 小時。
#
# 舊排程加上 GitHub 的延遲後落在台北 21:30~05:30，剛好全部卡在
# 資料出現的前一刻 —— 8 次排程只有 1 次產生 commit，命中率 12.5%。
#
# ★ 為什麼是每小時，而不是「改排早上 7 點」
# GitHub 的排程延遲是 0~7 小時且不可控（1151022s-1 實測平均 3.1 小時、
# 最糟 6.9 小時），任何單一時間點都會被打散，沒有一個設法能穩定命中。
# 密集排程才是可靠解：沒有新資料時 fetch.py 只打 2 個端點就結束，
# 實測耗時 3 秒；公開 repo 的 Actions 分鐘數不計費，成本可以忽略。
#
# ★ 為什麼跳過 UTC 01:00~06:30
# 那是台北 09:00~14:30，也就是開盤到收盤。資料不可能在盤中翻新
# （實測：證交所 05:20 出前一日的檔，櫃買 14:00 重寫但內容不變），
# 所以那幾個小時的探測沒有意義，砍掉。一天從 24 次降到 18 次。
#
# ★ 但刻意**不在程式裡加硬閘門**
# GitHub 的延遲會讓「排幾點」和「幾點真的跑」脫鉤。如果 fetch.py 看到
# 盤中就直接退出，那些被延遲推進盤中的執行會被白白丟掉 —— 而它們是
# 有用的樣本。砍排程是「少安排」，加閘門是「主動丟棄」，兩件事不一樣。
#
# ★ 關鍵的那段沒有被影響
# 證交所的翻新發生在台北 05:20（= UTC 21:20），離被砍掉的區間很遠。
#
# ★★ 每小時還有第二個目的：量出官方到底幾點更新 ★★
# fetch.py 每次執行都會往 data/probe_log.csv 追加一行，
# **包含沒有新資料的那些**。記的是「幾點探測、看到哪一天的資料、
# 那個檔案是幾點生成的（last-modified）」。
#
# 原本只有命中才 commit，所以否定樣本全部消失，窗口才會寬到 32 分鐘。
# 有了每小時的連續紀錄，幾天之後就能把更新時間夾到幾分鐘之內，
# 到時候再決定要不要把頻率降回來。
#
# ★ 為什麼拿掉 1-5（只跑週一到週五）
# 週五收盤的資料要到**週六清晨**才出現，而週六不跑 —— 這就是
# 2026-11-13（週五）的資料一路缺到下週一的直接原因。改成每天都跑。
# 非交易日沒有新資料，會在 3 秒內結束，不會產生多餘的 commit。
#
# ★ 為什麼是 :17 而不是整點
# 整點是 GitHub 排程的尖峰，延遲與被丟棄的機率都比較高。
#
# ★ concurrency 會自動收斂：
# 同一個 group 裡已經在排隊的 run 會被新的取代，所以就算延遲導致
# 好幾個排程擠在一起，也不會疊成一串重複執行。
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '17 0,7-23 * * *'   # 每小時，但跳過台北 09:00~14:30（盤中）
  workflow_dispatch:            # 也可以手動觸發
    inputs:
      force:
        description: '即使沒有新資料也重跑'
        type: boolean
        default: false
      rebuild:
        description: '重算所有歷史榜單'
        type: boolean
        default: false

# 要能 commit 回 repo
permissions:
  contents: write

# 避免兩次排程同時跑而互相覆蓋
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ★ 抓取本身只用標準函式庫（urllib、json、sqlite3）。
      # pandas 只有「算技術指標」那一步需要 —— core/indicators.py 是
      # 和本機 GUI **共用同一份檔案**（sha256 相同），所以邏輯只有一份。
      # 另寫一份純 Python 的版本會變成兩套邏輯，而指標很容易分岔
      # （平滑方式、初始值、NaN 處理差一點結果就不同）。
      # 「網頁上的 KD 和 GUI 上的 KD 不一樣」比多一個依賴糟糕得多。
      - name: 安裝 pandas（只有算指標需要）
        # ★ 版本必須和本機 GUI 的環境一致。
        # 共用同一份 indicators.py 的目的是「兩邊算出同樣的數字」，
        # 如果 pandas 大版本不同（rolling/ewm 的預設值改過），
        # 共用檔案的保證就失效了 —— 那比各寫一份還糟，因為會讓人誤以為一致。
        run: pip install --no-cache-dir "pandas==3.0.1" "numpy==2.4.2"


      - name: 抓取並計算榜單
        env:
          SCHEDULED_AT: ${{ github.event.schedule }}
          TZ: Asia/Taipei
        run: |
          python fetch.py \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.rebuild && '--rebuild' || '' }}

      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code -- data/; then
            echo "資料沒有變動，不 commit"
            exit 0
          fi
          # 只有探測紀錄變動 = 這次是空跑，用不同的 commit 訊息，
          # 這樣 git log 一眼就分得出「真的有新資料」和「只是探測」
          if git diff --quiet --exit-code -- data/ ':(exclude)data/probe_log.csv'; then
            MSG="探測紀錄 $(date '+%Y-%m-%d %H:%M')"
          else
            DATE=$(python -c "import json;print(json.load(open('data/meta.json'))['data_date'])")
            MSG="資料更新 ${DATE}"
          fi
          git add data/
          git commit -m "${MSG}"
          # 排程理論上被 concurrency 擋開了，但遠端若有新 commit
          # 還是要先 rebase，否則 push 會被拒
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

      - name: 摘要
        if: always()
        run: |
          if [ -f data/meta.json ]; then
            python - <<'PY'
          import json, os
          m = json.load(open('data/meta.json'))
          size = sum(os.path.getsize(os.path.join(r, f))
                     for r, _, fs in os.walk('data') for f in fs)
          age = m.get('age_days')
          lines = [
            "| 項目 | 值 |", "|---|---|",
            f"| 資料日期 | {m.get('data_date')} |",
            f"| 距今 | {age if age is not None else '—'} 個日曆天 |",
            f"| 排程 | {m.get('scheduled') or '手動'} |",
            f"| 實際執行 | {m.get('run_at_tpe') or m.get('run_at')} |",
            f"| 累積交易日 | {m.get('trading_days')} |",
            f"| 白名單 | {m.get('stocks')} 檔 |",
            f"| data/ 大小 | {size/1024/1024:.2f} MB |",
          ]
          miss = m.get('missing') or []
          if miss:
              lines.append(f"| ⚠ 疑似漏掉 | {', '.join(miss)} |")
          for n in (m.get('notes') or []):
              lines.append(f"| 註記 | {n} |")
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a',
               encoding='utf-8').write("\n".join(lines) + "\n")
          PY
          fi
